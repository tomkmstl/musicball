<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musicball - Offline</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000614;
            color: #dbeafe;
            font-family: Arial, sans-serif;
            padding: 24px;
            box-sizing: border-box;
        }

        .offline-card {
            width: 100%;
            max-width: 460px;
            background: #071225;
            border-radius: 18px;
            padding: 28px;
            text-align: center;
            box-sizing: border-box;
        }

        .offline-card img {
            width: 120px;
            height: 120px;
            display: block;
            margin: 0 auto 20px;
            border-radius: 24px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            margin: 0;
            line-height: 1.5;
            color: #bfdbfe;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <img src="assets/pwa/icons/icon-192.png" alt="Musicball">
        <h1>You're offline.</h1>
        <p>Musicball will reconnect automatically when your internet connection comes back.</p>
    </div>
</body>
</html>
